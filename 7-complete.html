<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Complete — Full Network Overview</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --wrap-width: 800px;
    --diagram-padding: 24px 8px;
    --topo-font-size: 12px;
    --topo-font-weight: 600;
    --topo-small-size: 10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="module-nav">
    <a href="6-endpoints.html" class="btn-back">
      <div class="back-label">Go Back</div>
      <div class="back-title">
        <span class="arrow">←</span>
        Adding Branch 3 Endpoints
      </div>
    </a>
    <a href="index.html" class="btn-next disabled">
      <div class="next-label">Up Next</div>
      <div class="next-title">
        Lab Complete
        <span class="arrow">→</span>
      </div>
    </a>
  </div>

  <h1>Lab Complete</h1>
  <p class="sub">Cisco Packet Tracer · The Full Network Overview</p>

  <div class="progress" id="progress"></div>

  <div class="card">
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="title"></h2>
    <p class="desc" id="desc"></p>
    
    <div class="diagram">
      <svg id="topo" viewBox="0 0 780 280" role="img">
        <!-- Backbone Links -->
        <g id="link-r1-r2"><line x1="150" y1="150" x2="630" y2="150"/><text class="small" x="390" y="140">10.0.0.0/24</text></g>
        <g id="link-r2-r3"><line x1="630" y1="150" x2="390" y2="50"/><text class="small" x="530" y="95">10.0.1.0/24</text></g>
        <g id="link-r1-r3"><line x1="150" y1="150" x2="390" y2="50"/><text class="small" x="250" y="95">10.0.2.0/24</text></g>

        <!-- R1 Branch Links -->
        <g id="link-r1-sw1"><line x1="150" y1="180" x2="150" y2="210"/></g>
        <g id="link-sw1-pc1"><line x1="130" y1="240" x2="110" y2="260"/></g>
        <g id="link-sw1-pc2"><line x1="170" y1="240" x2="190" y2="260"/></g>

        <!-- R2 Branch Links -->
        <g id="link-r2-sw2"><line x1="630" y1="180" x2="630" y2="210"/></g>
        <g id="link-sw2-pc3"><line x1="610" y1="240" x2="590" y2="260"/></g>
        <g id="link-sw2-pc4"><line x1="650" y1="240" x2="670" y2="260"/></g>

        <!-- R3 Branch Links -->
        <g id="link-r3-sw3"><line x1="390" y1="80" x2="390" y2="105"/></g>
        <g id="link-sw3-pc5"><line x1="370" y1="135" x2="350" y2="160"/></g>
        <g id="link-sw3-pc6"><line x1="410" y1="135" x2="430" y2="160"/></g>

        <!-- R1 -->
        <g id="r1"><rect x="110" y="120" width="80" height="60" rx="7"/><text x="150" y="150">R1</text></g>
        <g id="sw1"><rect x="120" y="210" width="60" height="30" rx="5"/><text x="150" y="225">SW1</text></g>
        <g id="pc1"><rect x="80" y="260" width="50" height="30" rx="5"/><text x="105" y="275">PC0</text><text class="small" x="105" y="300">192.168.1.10</text></g>
        <g id="pc2"><rect x="170" y="260" width="50" height="30" rx="5"/><text x="195" y="275">PC1</text><text class="small" x="195" y="300">192.168.1.11</text></g>

        <!-- R2 -->
        <g id="r2"><rect x="590" y="120" width="80" height="60" rx="7"/><text x="630" y="150">R2</text></g>
        <g id="sw2"><rect x="600" y="210" width="60" height="30" rx="5"/><text x="630" y="225">SW2</text></g>
        <g id="pc3"><rect x="560" y="260" width="50" height="30" rx="5"/><text x="585" y="275">PC2</text><text class="small" x="585" y="300">192.168.2.10</text></g>
        <g id="pc4"><rect x="650" y="260" width="50" height="30" rx="5"/><text x="675" y="275">PC3</text><text class="small" x="675" y="300">192.168.2.11</text></g>

        <!-- R3 -->
        <g id="r3"><rect x="350" y="20" width="80" height="60" rx="7"/><text x="390" y="50">R3</text></g>
        <g id="sw3"><rect x="360" y="105" width="60" height="30" rx="5"/><text x="390" y="120">SW3</text></g>
        <g id="pc5"><rect x="320" y="160" width="50" height="30" rx="5"/><text x="345" y="175">PC4</text><text class="small" x="345" y="200">192.168.3.10</text></g>
        <g id="pc6"><rect x="410" y="160" width="50" height="30" rx="5"/><text x="435" y="175">PC5</text><text class="small" x="435" y="200">192.168.3.11</text></g>
      </svg>
    </div>

    <pre class="code" id="code"></pre>

    <div class="nav">
      <button class="nav-btn" id="back">← Back</button>
      <button class="nav-btn primary" id="next">Next →</button>
    </div>
  </div>
</div>

<script>
const steps = [
  {
    title: "Step 1: The Complete Architecture",
    desc: "Look at what you built! You have a fully functional, redundant enterprise network. It consists of a Triangle Backbone at the top (R1, R2, R3) and three Branches (LANs) at the bottom.",
    hl: ["r1","r2","r3","sw1","sw2","sw3"],
    code: `<span class="cm">! The Triangle Backbone provides Redundancy.
! The 3 Switches provide Local Connectivity.
! Everything is tied together by OSPF.</span>`
  },
  {
    title: "Step 2: The Local Branches (LANs)",
    desc: "Each router acts as the Default Gateway for its local PCs. The switches are transparent Layer 2 devices, simply passing traffic from the PCs to the router. Notice the IP scheme: .1.x, .2.x, and .3.x.",
    hl: ["r1","sw1","pc1","pc2"],
    code: `<span class="cm">! Branch 1 Example (R1):</span>
R1 G0/0 = 192.168.1.1 (Gateway)
PC0 = 192.168.1.10
PC1 = 192.168.1.11

<span class="cm">! If PC0 pings PC1, it never leaves R1.</span>`
  },
  {
    title: "Step 3: The Magic Backbone",
    desc: "R1, R2, and R3 share all their known networks. Because they form a triangle, the routers automatically calculate the shortest path. If a cable gets cut, traffic instantly reroutes the other way.",
    hl: ["r1","r2","r3","link-r1-r2","link-r2-r3","link-r1-r3"],
    code: `<span class="cm">! The backbone is highly resilient. 
! If the R1-R2 link goes down, traffic from Branch 1
! to Branch 2 will just flow through R3 instead!</span>`
  },
  {
    title: "Step 4: What is OSPF?",
    desc: "OSPF (Open Shortest Path First) is the 'brain' of the routers. Instead of you manually typing routes, OSPF acts like a GPS group chat. The routers constantly share updates, ensuring they always know the fastest way to any network.",
    hl: ["r1","r2","r3"],
    code: `<span class="cm">! Without OSPF (Static Routing - Manual & Tedious):</span>
<span class="err">R1(config)# ip route 192.168.3.0 255.255.255.0 10.0.2.2</span>

<span class="cm">! With OSPF (Dynamic Routing - Automatic & Scalable):</span>
<span class="ok">R1(config)# router ospf 1
R1(config-router)# network 10.0.2.0 0.0.0.255 area 0</span>`
  },
  {
    title: "Step 5: The Journey of a Ping",
    desc: "When you ping from PC0 (192.168.1.10) to PC4 (192.168.3.10), the packet travels through the switches and uses the direct shortcut link between R1 and R3.",
    hl: ["pc1", "link-sw1-pc1", "sw1", "link-r1-sw1", "r1", "link-r1-r3", "r3", "link-r3-sw3", "sw3", "link-sw3-pc5", "pc5"],
    code: `<span class="cm">! 1. PC0 hands the packet to SW1, which passes it to the Gateway (R1).</span>
<span class="cm">! 2. R1 looks at its routing table. It sees two paths to 192.168.3.0:
   - R1 -> R2 -> R3 (2 hops)
   - R1 -> R3 (1 hop)</span>
<span class="cm">! 3. R1 chooses the direct 1-hop path over the 10.0.2.0 link to R3.</span>
<span class="cm">! 4. R3 receives it, passes it to SW3, which delivers it to PC4.</span>

PC0> ping 192.168.3.10
<span class="ok">Reply from 192.168.3.10: bytes=32 time&lt;1ms TTL=125</span>`
  }
];

const NODES = ["r1","sw1","pc1","pc2","r2","sw2","pc3","pc4","r3","sw3","pc5","pc6",
               "link-r1-r2","link-r2-r3","link-r1-r3","link-r1-sw1","link-sw1-pc1","link-sw1-pc2",
               "link-r2-sw2","link-sw2-pc3","link-sw2-pc4","link-r3-sw3","link-sw3-pc5","link-sw3-pc6"];

const total = steps.length; let cur = 0;
const segsEl = document.getElementById("progress");

steps.forEach((_, i) => { 
  const b = document.createElement("button"); 
  b.className="seg"; 
  b.addEventListener("click", () => { cur=i; render(); }); 
  segsEl.appendChild(b); 
});

const $ = id => document.getElementById(id);

function render(){
  const s = steps[cur];
  $("eyebrow").textContent = `Step ${cur + 1} of ${total}`;
  $("title").textContent = s.title;
  $("desc").textContent = s.desc;
  $("code").innerHTML = s.code;

  NODES.forEach(id => {
    const el = $(id);
    if (!el) return;
    const on = s.hl.includes(id);
    el.classList.toggle("hl", on);
    el.classList.toggle("dim", !on);
  });

  [...segsEl.children].forEach((b, i) => {
    b.classList.toggle("active", i===cur);
    b.classList.toggle("done", i<cur);
  });

  $("back").disabled = cur === 0;
  $("next").textContent = cur === total - 1 ? "Return to Home" : "Next →";
}

$("back").addEventListener("click", () => { if(cur>0){cur--;render();} });
$("next").addEventListener("click", () => {
  if (cur === total - 1) {
    window.location.href = "index.html";
  } else {
    cur++;
    render();
  }
});

document.addEventListener("keydown", e => {
  if(e.key==="ArrowRight"){
    if(cur === total - 1){ window.location.href = "index.html"; }
    else { cur++; render(); }
  }
  if(e.key==="ArrowLeft"&&cur>0){cur--;render();}
});

render();
</script>
</body>
</html>
