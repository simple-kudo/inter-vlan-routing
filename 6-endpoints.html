<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Completing Branch 3 — Endpoints</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --wrap-width: 820px;
    --diagram-padding: 24px 8px;
    --topo-font-size: 12px;
    --topo-font-weight: 600;
    --topo-small-size: 10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="module-nav">
    <a href="5-r3-r1.html" class="btn-back">
      <div class="back-label">Go Back</div>
      <div class="back-title">
        <span class="arrow">←</span>
        Completing the Triangle
      </div>
    </a>
    <a href="#" class="btn-next disabled">
      <div class="next-label">Up Next</div>
      <div class="next-title">
        Lab Complete
        <span class="arrow">→</span>
      </div>
    </a>
  </div>

  <h1>Completing Branch 3</h1>
  <p class="sub">Cisco Packet Tracer · Attaching the Switch and PCs</p>

  <div class="progress" id="progress"></div>

  <div class="card">
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="title"></h2>
    <p class="desc" id="desc"></p>
    
    <div class="diagram">
      <svg id="topo" viewBox="0 0 780 280" role="img">
        <!-- Backbone Links -->
        <g id="link-r1-r2"><line x1="150" y1="150" x2="630" y2="150"/></g>
        <g id="link-r2-r3"><line x1="630" y1="150" x2="390" y2="50"/></g>
        <g id="link-r1-r3"><line x1="150" y1="150" x2="390" y2="50"/></g>

        <!-- R1 Branch Links -->
        <g id="link-r1-sw1"><line x1="150" y1="180" x2="150" y2="210"/></g>
        <g id="link-sw1-pc1"><line x1="130" y1="240" x2="110" y2="260"/></g>
        <g id="link-sw1-pc2"><line x1="170" y1="240" x2="190" y2="260"/></g>

        <!-- R2 Branch Links -->
        <g id="link-r2-sw2"><line x1="630" y1="180" x2="630" y2="210"/></g>
        <g id="link-sw2-pc3"><line x1="610" y1="240" x2="590" y2="260"/></g>
        <g id="link-sw2-pc4"><line x1="650" y1="240" x2="670" y2="260"/></g>

        <!-- R3 Branch Links (NEW) -->
        <g id="link-r3-sw3"><line x1="390" y1="80" x2="390" y2="105"/></g>
        <g id="link-sw3-pc5"><line x1="370" y1="135" x2="350" y2="160"/></g>
        <g id="link-sw3-pc6"><line x1="410" y1="135" x2="430" y2="160"/></g>

        <!-- R1 -->
        <g id="r1"><rect x="110" y="120" width="80" height="60" rx="7"/><text x="150" y="150">R1</text></g>
        <g id="sw1"><rect x="120" y="210" width="60" height="30" rx="5"/><text x="150" y="225">SW1</text></g>
        <g id="pc1"><rect x="80" y="260" width="50" height="30" rx="5"/><text x="105" y="275">PC0</text></g>
        <g id="pc2"><rect x="170" y="260" width="50" height="30" rx="5"/><text x="195" y="275">PC1</text></g>

        <!-- R2 -->
        <g id="r2"><rect x="590" y="120" width="80" height="60" rx="7"/><text x="630" y="150">R2</text></g>
        <g id="sw2"><rect x="600" y="210" width="60" height="30" rx="5"/><text x="630" y="225">SW2</text></g>
        <g id="pc3"><rect x="560" y="260" width="50" height="30" rx="5"/><text x="585" y="275">PC2</text></g>
        <g id="pc4"><rect x="650" y="260" width="50" height="30" rx="5"/><text x="675" y="275">PC3</text></g>

        <!-- R3 (NEW) -->
        <g id="r3"><rect x="350" y="20" width="80" height="60" rx="7"/><text x="390" y="50">R3</text></g>
        <g id="sw3"><rect x="360" y="105" width="60" height="30" rx="5"/><text x="390" y="120">SW3</text></g>
        <g id="pc5"><rect x="320" y="160" width="50" height="30" rx="5"/><text x="345" y="175">PC4</text></g>
        <g id="pc6"><rect x="410" y="160" width="50" height="30" rx="5"/><text x="435" y="175">PC5</text></g>

      </svg>
    </div>

    <pre class="code" id="code"></pre>

    <div class="nav">
      <button class="nav-btn" id="back">← Back</button>
      <button class="nav-btn primary" id="next">Next →</button>
    </div>
  </div>
</div>

<script>
const steps = [
  {
    title: "Step 1: Connect the Switch",
    desc: "Drop a 2960 switch into the workspace. Connect R3's G0/0 interface to the switch using a Copper Straight-Through cable.",
    hl: ["r3", "sw3", "link-r3-sw3"],
    code: `<span class="cm">R3 G0/0 ────── SW3   (Straight-Through)</span>

<span class="cm">! No switch configuration is needed. 
! It acts as a dumb Layer 2 pass-through.</span>`
  },
  {
    title: "Step 2: Connect the PCs",
    desc: "Drop two PCs into the workspace. Connect them both to the switch using straight-through cables.",
    hl: ["sw3", "pc5", "pc6", "link-sw3-pc5", "link-sw3-pc6"],
    code: `<span class="cm">SW3 ────── PC4   (Straight-Through)</span>
<span class="cm">SW3 ────── PC5   (Straight-Through)</span>

<span class="cm">! The link lights should turn green.</span>`
  },
  {
    title: "Step 3: Configure PC4",
    desc: "Click on PC4, go to Desktop > IP Configuration. Give it an IP in the 192.168.3.x network, and point it to R3's LAN interface as the gateway.",
    hl: ["pc5"],
    code: `<span class="cm">! PC4 (Left PC in Branch 3):</span>
<span class="ok">IP Address:      192.168.3.10</span>
<span class="ok">Subnet Mask:     255.255.255.0</span>
<span class="ok">Default Gateway: 192.168.3.1</span>`
  },
  {
    title: "Step 4: Configure PC5",
    desc: "Give the second PC an IP address. Notice we just increment the last number from .10 to .11.",
    hl: ["pc6"],
    code: `<span class="cm">! PC5 (Right PC in Branch 3):</span>
<span class="ok">IP Address:      192.168.3.11</span>
<span class="ok">Subnet Mask:     255.255.255.0</span>
<span class="ok">Default Gateway: 192.168.3.1</span>`
  },
  {
    title: "Step 5: Test Branch 3 Locally",
    desc: "Before pinging across the network, test if the PCs can reach their local router.",
    hl: ["r3", "pc5"],
    code: `<span class="cm">! On PC4:</span>
PC4> ping 192.168.3.1
<span class="ok">Reply from 192.168.3.1: bytes=32 time&lt;1ms TTL=255</span>

<span class="cm">! If this fails, check the Default Gateway on the PC 
! and make sure R3's G0/0 is not shut down.</span>`
  },
  {
    title: "Step 6: The Grand Finale",
    desc: "Now test the full network. Ping from Branch 1 (PC0) to Branch 3 (PC4). The packet will route through the OSPF backbone you built.",
    hl: ["pc1", "r1", "r2", "r3", "pc5"],
    code: `<span class="cm">! From PC0 (Branch 1) to PC4 (Branch 3):</span>
PC0> ping 192.168.3.10
<span class="ok">Reply from 192.168.3.10: bytes=32 time&lt;1ms TTL=125</span>

<span class="cm">! From PC2 (Branch 2) to PC5 (Branch 3):</span>
PC2> ping 192.168.3.11
<span class="ok">Reply from 192.168.3.11: bytes=32 time&lt;1ms TTL=126</span>

<span class="cm">! All three branches are fully connected!</span>`
  }
];

const NODES = ["r1","sw1","pc1","pc2","r2","sw2","pc3","pc4","r3","sw3","pc5","pc6",
               "link-r1-r2","link-r2-r3","link-r1-r3","link-r1-sw1","link-sw1-pc1","link-sw1-pc2",
               "link-r2-sw2","link-sw2-pc3","link-sw2-pc4","link-r3-sw3","link-sw3-pc5","link-sw3-pc6"];

const total = steps.length; let cur = 0;
const segsEl = document.getElementById("progress");

steps.forEach((_, i) => { 
  const b = document.createElement("button"); 
  b.className="seg"; 
  b.addEventListener("click", () => { cur=i; render(); }); 
  segsEl.appendChild(b); 
});

const $ = id => document.getElementById(id);

function render(){
  const s = steps[cur];
  $("eyebrow").textContent = `Step ${cur + 1} of ${total}`; 
  $("title").textContent = s.title; 
  $("desc").textContent = s.desc; 
  $("code").innerHTML = s.code;
  
  NODES.forEach(id => { 
    const el = $(id); 
    if (!el) return;
    const on = s.hl.includes(id); 
    el.classList.toggle("hl", on); 
    el.classList.toggle("dim", !on); 
  });
  
  [...segsEl.children].forEach((b, i) => { 
    b.classList.toggle("active", i===cur); 
    b.classList.toggle("done", i<cur); 
  });
  
  $("back").disabled = cur === 0; 
  $("next").textContent = cur === total - 1 ? "Restart" : "Next →";
}

$("back").addEventListener("click", () => { if(cur>0){cur--;render();} });
$("next").addEventListener("click", () => { cur=(cur+1)%total; render(); });

document.addEventListener("keydown", e => { 
  if(e.key==="ArrowRight"){cur=(cur+1)%total;render();} 
  if(e.key==="ArrowLeft"&&cur>0){cur--;render();} 
});

render();
</script>
</body>
</html>
