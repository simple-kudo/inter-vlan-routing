<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Routers Talking — Cisco Packet Tracer</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --wrap-width: 800px;
    --diagram-padding: 12px 8px;
    --topo-font-size: 13px;
    --topo-font-weight: 500;
    --topo-small-size: 10.5px;
  }
  #topo .dim { opacity: 0.22; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Two routers talking</h1>
  <p class="sub">Cisco Packet Tracer · Switched LANs for guaranteed link-up</p>

  <div class="progress" id="progress"></div>

  <div class="card">
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="title"></h2>
    <p class="desc" id="desc"></p>

    <div class="diagram">
      <svg id="topo" viewBox="0 0 780 200" role="img"
           aria-label="PC1 connects to Switch 1, Switch 1 to R1, R1 to R2, R2 to Switch 2, Switch 2 to PC2">
        <g id="link-pc1-sw1">
          <line x1="70" y1="120" x2="100" y2="120"/>
        </g>
        <g id="link-sw1-r1">
          <line x1="160" y1="120" x2="190" y2="120"/>
          <text class="small" x="175" y="106">.1.0/24</text>
        </g>
        <g id="link-wan">
          <line x1="270" y1="120" x2="480" y2="120"/>
          <text class="small" x="375" y="106">10.0.0.0/24</text>
        </g>
        <g id="link-r2-sw2">
          <line x1="560" y1="120" x2="600" y2="120"/>
          <text class="small" x="580" y="106">.2.0/24</text>
        </g>
        <g id="link-sw2-pc2">
          <line x1="660" y1="120" x2="690" y2="120"/>
        </g>

        <g id="pc1">
          <rect x="10" y="95" width="60" height="50" rx="7"/>
          <text x="40" y="120">PC1</text>
          <text class="small" x="40" y="166">192.168.1.10</text>
        </g>

        <g id="sw1">
          <rect x="100" y="100" width="60" height="40" rx="7"/>
          <text x="130" y="120">SW1</text>
        </g>

        <g id="r1">
          <rect x="190" y="90" width="80" height="60" rx="7"/>
          <text x="230" y="120">R1</text>
          <text class="small" x="230" y="170">G0/0 192.168.1.1</text>
          <text class="small" x="230" y="185">G0/1 10.0.0.1</text>
        </g>

        <g id="r2">
          <rect x="480" y="90" width="80" height="60" rx="7"/>
          <text x="520" y="120">R2</text>
          <text class="small" x="520" y="170">G0/0 192.168.2.1</text>
          <text class="small" x="520" y="185">G0/1 10.0.0.2</text>
        </g>

        <g id="sw2">
          <rect x="600" y="100" width="60" height="40" rx="7"/>
          <text x="630" y="120">SW2</text>
        </g>

        <g id="pc2">
          <rect x="690" y="95" width="60" height="50" rx="7"/>
          <text x="720" y="120">PC2</text>
          <text class="small" x="720" y="166">192.168.2.10</text>
        </g>
      </svg>
    </div>

    <pre class="code" id="code"></pre>

    <div class="nav">
      <button class="nav-btn" id="back">← Back</button>
      <button class="nav-btn primary" id="next">Next →</button>
    </div>
  </div>
</div>

<script>
const steps = [
  {
    title: "Connect the routers",
    desc: "Use two Cisco 2911 routers. Connect R1 G0/1 directly to R2 G0/1 using a Copper Straight-Through cable.",
    hl: ["r1", "r2", "link-wan"],
    code: `<span class="cm">R1 G0/1 ────── R2 G0/1     Copper Straight-Through</span>

<span class="cm">! Notice we use a /24 (255.255.255.0) on this link instead of a /30.</span>
<span class="cm">! That leaves 252 addresses free for future routers.</span>`
  },
  {
    title: "Give R1 its IP addresses",
    desc: "Assign the WAN link IP, then the LAN IP that will face the switch. Make sure to enable both.",
    hl: ["r1"],
    code: `R1> enable
R1# configure terminal
R1(config)# interface g0/1
R1(config-if)# ip address 10.0.0.1 255.255.255.0
R1(config-if)# no shutdown
R1(config-if)# exit
R1(config)# interface g0/0
R1(config-if)# ip address 192.168.1.1 255.255.255.0
R1(config-if)# no shutdown`
  },
  {
    title: "Give R2 its IP addresses",
    desc: "Same configuration on the other router. If the WAN link stays down, check your cabling.",
    hl: ["r2"],
    code: `R2> enable
R2# configure terminal
R2(config)# interface g0/1
R2(config-if)# ip address 10.0.0.2 255.255.255.0
R2(config-if)# no shutdown
R2(config-if)# exit
R2(config)# interface g0/0
R2(config-if)# ip address 192.168.2.1 255.255.255.0
R2(config-if)# no shutdown`
  },
  {
    title: "Add the switches",
    desc: "Drop in two 2960 switches. Connect R1 G0/0 to SW1, and R2 G0/0 to SW2 using straight-through cables. This guarantees the router's LAN interface comes up (fixing the 'down' issue). No switch config is needed.",
    hl: ["r1", "sw1", "r2", "sw2", "link-sw1-r1", "link-r2-sw2"],
    code: `<span class="cm">R1 G0/0 ────── SW1        Copper Straight-Through</span>
<span class="cm">R2 G0/0 ────── SW2        Copper Straight-Through</span>

<span class="cm">! Check R1 again:</span>
R1# show ip interface brief
Interface   IP-Address      Status   Protocol
G0/0        192.168.1.1     <span class="ok">up       up</span>
G0/1        10.0.0.1        <span class="ok">up       up</span>`
  },
  {
    title: "Connect the PCs",
    desc: "Connect PC1 to SW1, and PC2 to SW2 using straight-through cables. Give them static IPs in their respective networks and set their default gateways to the router's LAN IP.",
    hl: ["pc1", "sw1", "pc2", "sw2", "link-pc1-sw1", "link-sw2-pc2"],
    code: `<span class="cm">PC1: IP 192.168.1.10  ·  Gateway 192.168.1.1</span>
<span class="cm">PC2: IP 192.168.2.10  ·  Gateway 192.168.2.1</span>

<span class="cm">! Test the local network first. This should succeed now.</span>
PC1> ping 192.168.1.1`
  },
  {
    title: "Turn on OSPF to route between them",
    desc: "Right now, PC1 can only ping its own router. To reach PC2, the routers need to share routes. OSPF does this automatically and scales perfectly when you add a 3rd router later.",
    hl: ["pc1", "sw1", "r1", "r2", "sw2", "pc2", "link-wan", "link-sw1-r1", "link-r2-sw2", "link-pc1-sw1", "link-sw2-pc2"],
    code: `<span class="cm">! R1</span>
R1(config)# router ospf 1
R1(config-router)# network 192.168.1.0 0.0.0.255 area 0
R1(config-router)# network 10.0.0.0 0.0.0.255 area 0

<span class="cm">! R2</span>
R2(config)# router ospf 1
R2(config-router)# network 192.168.2.0 0.0.0.255 area 0
R2(config-router)# network 10.0.0.0 0.0.0.255 area 0

<span class="cm">! Final Test across the whole network:</span>
PC1> ping 192.168.2.10
<span class="ok">Reply from 192.168.2.10: bytes=32 time&lt;1ms TTL=126</span>`
  }
];

const NODES = ["pc1","sw1","r1","r2","sw2","pc2",
               "link-pc1-sw1","link-sw1-r1","link-wan","link-r2-sw2","link-sw2-pc2"];
const total = steps.length;
let cur = 0;

const segsEl = document.getElementById("progress");
steps.forEach((_, i) => {
  const b = document.createElement("button");
  b.className = "seg";
  b.setAttribute("aria-label", "Go to step " + (i + 1));
  b.addEventListener("click", () => { cur = i; render(); });
  segsEl.appendChild(b);
});

const $ = id => document.getElementById(id);

function render(){
  const s = steps[cur];

  $("eyebrow").textContent = `Step ${cur + 1} of ${total}`;
  $("title").textContent = s.title;
  $("desc").textContent = s.desc;
  $("code").innerHTML = s.code;

  NODES.forEach(id => {
    const el = $(id);
    const on = s.hl.includes(id);
    el.classList.toggle("hl", on);
    el.classList.toggle("dim", !on);
  });

  [...segsEl.children].forEach((b, i) => {
    b.classList.toggle("active", i === cur);
    b.classList.toggle("done", i < cur);
  });

  $("back").disabled = cur === 0;
  $("next").textContent = cur === total - 1 ? "Restart" : "Next →";
}

$("back").addEventListener("click", () => { if (cur > 0) { cur--; render(); } });
$("next").addEventListener("click", () => { cur = (cur + 1) % total; render(); });

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { cur = (cur + 1) % total; render(); }
  if (e.key === "ArrowLeft" && cur > 0) { cur--; render(); }
});

render();
</script>
</body>
</html>
