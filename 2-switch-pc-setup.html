<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch & PC Setup — Branch 1</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --wrap-width: 780px;
    --diagram-padding: 12px 8px;
    --topo-font-size: 13px;
    --topo-font-weight: 500;
    --topo-small-size: 10.5px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="module-nav">
    <a href="1-router-config.html" class="btn-back">
      <div class="back-label">Go Back</div>
      <div class="back-title">
        <span class="arrow">←</span>
        Router Configuration
      </div>
    </a>
    <a href="3-wan-connection.html" class="btn-next">
      <div class="next-label">Up Next</div>
      <div class="next-title">
        Connecting Branches (R1 to R2)
        <span class="arrow">→</span>
      </div>
    </a>
  </div>

  <h1>Branch 1: Switch & PC</h1>
  <p class="sub">Cisco Packet Tracer · Finish the LAN and learn how to scale</p>

  <div class="progress" id="progress"></div>

  <div class="card">
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="title"></h2>
    <p class="desc" id="desc"></p>
    <div class="diagram">
      <svg id="topo" viewBox="0 0 780 150" role="img">
        <g id="link-lan"><line x1="150" y1="75" x2="250" y2="75"/></g>
        <g id="link-pc"><line x1="330" y1="75" x2="430" y2="75"/></g>
        
        <g id="r1">
          <rect x="70" y="45" width="80" height="60" rx="7"/>
          <text x="110" y="75">R1</text>
          <text class="small" x="110" y="125">G0/0 192.168.1.1</text>
        </g>

        <g id="sw">
          <rect x="250" y="55" width="80" height="40" rx="7"/>
          <text x="290" y="75">SW1</text>
        </g>

        <g id="pc">
          <rect x="430" y="50" width="80" height="50" rx="7"/>
          <text x="470" y="75">PC1</text>
          <text class="small" x="470" y="125">192.168.1.10</text>
        </g>
      </svg>
    </div>
    <pre class="code" id="code"></pre>

    <div class="nav">
      <button class="nav-btn" id="back">← Back</button>
      <button class="nav-btn primary" id="next">Next →</button>
    </div>
  </div>
</div>
<script>
const steps = [
  {
    title: "Step 1: Connect the Switch",
    desc: "Drop a 2960 Switch. Connect R1's G0/0 interface to SW1 using a Copper Straight-Through cable. The switch requires zero configuration.",
    hl: ["r1", "sw", "link-lan"],
    code: `<span class="cm">R1 G0/0 ────── SW1        Copper Straight-Through</span>

<span class="cm">! Check the router interface. It should now be 'up/up'.</span>
R1# show ip interface brief`
  },
  {
    title: "Step 2: Connect the PC",
    desc: "Connect PC1 to any port on SW1 using a Copper Straight-Through cable. At this point, the link light will turn green, but the PC still can't talk to the router.",
    hl: ["sw", "pc", "link-pc"],
    code: `<span class="cm">SW1 ────── PC1        Copper Straight-Through</span>

<span class="cm">! The cable is connected, but the PC has no IP address yet.</span>`
  },
  {
    title: "Step 3: Configure the PC (GUI)",
    desc: "Click on PC1, go to the 'Desktop' tab, and open 'IP Configuration'. You must manually type the IP address, Subnet Mask, and Default Gateway here.",
    hl: ["pc"],
    code: `<span class="cm">! Click PC1 > Desktop > IP Configuration</span>

<span class="ok">IPv4 Address:     192.168.1.10</span>
<span class="ok">Subnet Mask:      255.255.255.0</span>
<span class="ok">Default Gateway:  192.168.1.1</span>

<span class="cm">! The gateway is the router's G0/0 IP. This tells the PC 
! where to send traffic destined for another network.</span>`
  },
  {
    title: "Step 4: Test the Local Link",
    desc: "Now that the PC has an IP and a gateway, test if it can reach the router. Open the PC's Command Prompt to ping.",
    hl: ["r1", "sw", "pc", "link-lan", "link-pc"],
    code: `<span class="cm">! On PC1, open Command Prompt</span>
PC1> ping 192.168.1.1
<span class="ok">Reply from 192.168.1.1: bytes=32 time&lt;1ms TTL=255</span>

<span class="cm">! If you get 'Request timed out', double-check your 
! PC's Default Gateway and the router's 'no shutdown' status.</span>`
  },
  {
    title: "Step 5: The Reproducibility Blueprint",
    desc: "Branch 1 is done! To build Branch 2, you don't need to rethink anything. Just duplicate the steps and change the numbers.",
    hl: ["r1", "sw", "pc"],
    code: `<span class="cm">BRANCH 1 (You just built this)</span>
Router: 10.0.0.1 / 192.168.1.1
PC: 192.168.1.10  |  GW: 192.168.1.1

<span class="cm">BRANCH 2 (Build this next)</span>
Router: 10.0.0.2 / 192.168.2.1
PC: 192.168.2.10  |  GW: 192.168.2.1

<span class="cm">! Just connect R1 and R2 together with a cable, 
! and OSPF will automatically link the two branches.</span>`
  }
];
const NODES = ["r1","sw","pc","link-lan","link-pc"];
const total = steps.length; let cur = 0;
const segsEl = document.getElementById("progress");
steps.forEach((_, i) => { const b = document.createElement("button"); b.className="seg"; b.addEventListener("click", () => { cur=i; render(); }); segsEl.appendChild(b); });
const $ = id => document.getElementById(id);
function render(){
  const s = steps[cur];
  $("eyebrow").textContent = `Step ${cur + 1} of ${total}`; $("title").textContent = s.title; $("desc").textContent = s.desc; $("code").innerHTML = s.code;
  NODES.forEach(id => { const el = $(id); const on = s.hl.includes(id); el.classList.toggle("hl", on); el.classList.toggle("dim", !on); });
  [...segsEl.children].forEach((b, i) => { b.classList.toggle("active", i===cur); b.classList.toggle("done", i<cur); });
  $("back").disabled = cur === 0; $("next").textContent = cur === total - 1 ? "Restart" : "Next →";
}
$("back").addEventListener("click", () => { if(cur>0){cur--;render();} });
$("next").addEventListener("click", () => { cur=(cur+1)%total; render(); });
document.addEventListener("keydown", e => { if(e.key==="ArrowRight"){cur=(cur+1)%total;render();} if(e.key==="ArrowLeft"&&cur>0){cur--;render();} });
render();
</script>
</body>
</html>
