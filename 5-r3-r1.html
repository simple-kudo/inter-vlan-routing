<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R1 to R3 Direct Connection — Triangle Topology</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --wrap-width: 800px;
    --diagram-padding: 24px 8px;
    --topo-font-size: 13px;
    --topo-font-weight: 600;
    --topo-small-size: 10.5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Completing the Triangle</h1>
  <p class="sub">Cisco Packet Tracer · Direct R1 to R3 Connection</p>
  
  <div class="progress" id="progress"></div>
  
  <div class="card">
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="title"></h2>
    <p class="desc" id="desc"></p>
    
    <div class="diagram">
      <svg id="topo" viewBox="0 0 780 180" role="img">
        
        <!-- R1 to R2 Link -->
        <g id="link-r1-r2">
          <line x1="210" y1="120" x2="550" y2="120"/>
          <text class="small" x="380" y="105">10.0.0.0/24</text>
        </g>

        <!-- R2 to R3 Link -->
        <g id="link-r2-r3">
          <line x1="590" y1="120" x2="590" y2="50"/>
          <text class="small" x="640" y="85">10.0.1.0/24</text>
        </g>

        <!-- R1 to R3 Link (NEW) -->
        <g id="link-r1-r3">
          <line x1="210" y1="90" x2="550" y2="50"/>
          <text class="small" x="380" y="60">10.0.2.0/24</text>
        </g>

        <g id="r1">
          <rect x="130" y="90" width="80" height="60" rx="7"/>
          <text x="170" y="120">R1</text>
          <text class="small" x="170" y="165">G0/1: 10.0.0.1</text>
          <text class="small" x="170" y="175">G0/2: 10.0.2.1</text>
        </g>
        
        <g id="r2">
          <rect x="550" y="90" width="80" height="60" rx="7"/>
          <text x="590" y="120">R2</text>
          <text class="small" x="590" y="165">G0/1: 10.0.0.2</text>
          <text class="small" x="590" y="175">G0/2: 10.0.1.1</text>
        </g>

        <g id="r3">
          <rect x="550" y="20" width="80" height="60" rx="7"/>
          <text x="590" y="50">R3</text>
          <text class="small" x="590" y="15">G0/1: 10.0.1.2</text>
          <text class="small" x="590" y="5">G0/2: 10.0.2.2</text>
        </g>

      </svg>
    </div>

    <pre class="code" id="code"></pre>
    
    <div class="nav">
      <button class="nav-btn" id="back">← Back</button>
      <button class="nav-btn primary" id="next">Next →</button>
    </div>
  </div>
</div>

<script>
const steps = [
  {
    title: "Step 1: Connect the Cable",
    desc: "R1 and R3 both have one empty port left: G0/2. Connect them directly using a Copper Straight-Through cable. We will use a new subnet for this link: 10.0.2.0/24.",
    hl: ["r1", "r3", "link-r1-r3"],
    code: `<span class="cm">R1 G0/2 ────── R3 G0/2   (Straight-Through)</span>

<span class="cm">! The red triangles will disappear once we configure the IPs.</span>`
  },
  {
    title: "Step 2: Configure R1's New Interface",
    desc: "Give R1's G0/2 interface the IP address 10.0.2.1 so it can talk to R3 directly.",
    hl: ["r1"],
    code: `R1> enable
R1# configure terminal
R1(config)# interface g0/2
R1(config-if)# ip address 10.0.2.1 255.255.255.0
R1(config-if)# no shutdown`
  },
  {
    title: "Step 3: Configure R3's New Interface",
    desc: "Give R3's G0/2 interface the IP address 10.0.2.2 to complete the link.",
    hl: ["r3"],
    code: `R3> enable
R3# configure terminal
R3(config)# interface g0/2
R3(config-if)# ip address 10.0.2.2 255.255.255.0
R3(config-if)# no shutdown

<span class="cm">! The link lights are now green.</span>`
  },
  {
    title: "Step 4: Add the New Network to OSPF",
    desc: "Both routers need to advertise this new 10.0.2.0 network into OSPF so they can use it.",
    hl: ["r1", "r3"],
    code: `<span class="cm">! On R1:</span>
R1(config)# router ospf 1
R1(config-router)# network 10.0.2.0 0.0.0.255 area 0

<span class="cm">! On R3:</span>
R3(config)# router ospf 1
R3(config-router)# network 10.0.2.0 0.0.0.255 area 0`
  },
  {
    title: "Step 5: Verify Neighbors (Optional)",
    desc: "Wait about 10 seconds. R1 should now have TWO OSPF neighbors: R2 and R3.",
    hl: ["r1"],
    code: `R1# show ip ospf neighbor

<span class="cm">! You will see two entries:</span>
Neighbor ID     Pri   State           Address         Interface
<span class="ok">192.168.2.1       1   FULL/DR         10.0.0.2        GigabitEthernet0/1</span>
<span class="ok">10.0.2.2          1   FULL/DR         10.0.2.2        GigabitEthernet0/2</span>`
  },
  {
    title: "Step 6: The Ultimate Ping Test",
    desc: "Now go back to PC0 and ping R3's LAN interface (192.168.3.1). It will finally succeed! The packet is taking the direct shortcut from R1 to R3.",
    hl: ["r1", "r3"],
    code: `PC0> ping 192.168.3.1

<span class="ok">!!!!!
Success rate is 100 percent (5/5), round-trip min/avg/max = 1/1/1 ms</span>

<span class="cm">! Because OSPF sees two paths (R1->R2->R3 and R1->R3), 
! it automatically chooses the direct 1-hop path!</span>`
  }
];

const NODES = ["r1","r2","r3","link-r1-r2","link-r2-r3","link-r1-r3"];
const total = steps.length; let cur = 0;
const segsEl = document.getElementById("progress");

steps.forEach((_, i) => { 
  const b = document.createElement("button"); 
  b.className="seg"; 
  b.addEventListener("click", () => { cur=i; render(); }); 
  segsEl.appendChild(b); 
});

const $ = id => document.getElementById(id);

function render(){
  const s = steps[cur];
  $("eyebrow").textContent = `Step ${cur + 1} of ${total}`; 
  $("title").textContent = s.title; 
  $("desc").textContent = s.desc; 
  $("code").innerHTML = s.code;
  
  NODES.forEach(id => { 
    const el = $(id); 
    const on = s.hl.includes(id); 
    el.classList.toggle("hl", on); 
    el.classList.toggle("dim", !on); 
  });
  
  [...segsEl.children].forEach((b, i) => { 
    b.classList.toggle("active", i===cur); 
    b.classList.toggle("done", i<cur); 
  });
  
  $("back").disabled = cur === 0; 
  $("next").textContent = cur === total - 1 ? "Restart" : "Next →";
}

$("back").addEventListener("click", () => { if(cur>0){cur--;render();} });
$("next").addEventListener("click", () => { cur=(cur+1)%total; render(); });

document.addEventListener("keydown", e => { 
  if(e.key==="ArrowRight"){cur=(cur+1)%total;render();} 
  if(e.key==="ArrowLeft"&&cur>0){cur--;render();} 
});

render();
</script>
</body>
</html>
